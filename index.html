
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📸 My Image Gallery</h1>
        <p>Explore beautiful moments</p>
    </header>

    <div class="filters">
        <button class="filter active" data-category="all">All</button>
        <button class="filter" data-category="nature">Nature</button>
        <button class="filter" data-category="animals">Animals</button>
        <button class="filter" data-category="travel">Travel</button>
    </div>

    <main class="gallery" id="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600"
                 alt="Beautiful sunrise">
            <p>Beautiful Sunrise</p>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600"
                 alt="Cute dog">
            <p>Cute Dog</p>
        </div>

        <div class="gallery-item" data-category="travel">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
                 alt="Travel landscape">
            <p>Adventure</p>
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
                 alt="Green forest">
            <p>Green Forest</p>
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600"
                 alt="Golden retriever">
            <p>Golden Retriever</p>
        </div>

        <div class="gallery-item" data-category="travel">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
                 alt="Mountain view">
            <p>Mountain View</p>
        </div>

    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="close" id="close">&times;</button>
        <button class="nav prev" id="prev">&#10094;</button>
        <img id="lightbox-img" src="" alt="Selected gallery image">
        <button class="nav next" id="next">&#10095;</button>
        <p id="caption"></p>
    </div>

    <footer>
        <p>Created with HTML, CSS & JavaScript ❤️</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
